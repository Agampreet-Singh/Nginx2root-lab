# Same vulnerable binary, with the published workarounds applied:
#   - HTTP/2 off, HTTP/3/quic listeners removed
#   - fixed upstream instead of a request-derived one
#   - mirror removed

worker_processes 2;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
    server_tokens on;
    access_log /dev/stdout;

    upstream backend_fixed { server backend:8000; }

    server {
        listen 443 ssl;
        http2 off;

        ssl_certificate     /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;

        location / {
            root /usr/share/nginx/html;
        }

        location /app/ {
            proxy_pass http://backend_fixed/;
        }

        location /dyn/ {
            proxy_pass http://backend_fixed;
        }
    }
}
