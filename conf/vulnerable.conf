# Exposes the attack surface of the nginx2root CVEs:
#   HTTP/2 on                         -> CVE-2026-123007, CVE-2026-123633
#   HTTP/3 (quic) + proxying          -> CVE-2026-121810
#   resolver + request-derived
#   proxy_pass + mirror               -> CVE-2026-123634
# The mail-proxy CVE (CVE-2026-113425) is left out on purpose: it needs an
# auth_http service and is rarely relevant. Add a mail{} block if you need it.

worker_processes 2;
error_log /dev/stderr info;   # "worker process ... exited on signal" shows here

events { worker_connections 1024; }

http {
    server_tokens on;          # show the version in the Server header
    access_log /dev/stdout;

    resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS

    server {
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        http3 on;

        ssl_certificate     /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;
        add_header Alt-Svc 'h3=":443"; ma=86400';

        # Static files: CVE-2026-123007 needs nothing more than this.
        location / {
            root /usr/share/nginx/html;
        }

        # Plain upstream proxy (HTTP/2 and HTTP/3 front ends).
        location /app/ {
            proxy_pass http://backend:8000/;
        }

        # Request-derived upstream + mirror with body off (resolver bug).
        location /dyn/ {
            set $target "backend";
            proxy_pass http://$target:8000;
            mirror /mirror;
            mirror_request_body off;
        }
        location = /mirror {
            internal;
            proxy_pass http://backend:8000/mirror;
        }
    }
}
